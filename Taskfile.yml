version: '3'

includes:
  build:
    taskfile: ./Taskfile_{{OS}}.yml
    flatten: true
    optional: true
  git:
    taskfile: https://codeberg.org/jhot/taskfiles/raw/branch/main/git.yaml

vars:
  REPO: codeberg.org/jhot/hats

tasks:
  docker-login:
    desc: Login to the {{.REPO}} repo
    cmds:
      - docker login {{.REPO}}
    status:
      - cat ~/.docker/config.json | jq -e '.auths."codeberg.org".auth'

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:all:
    desc: Run unit tests and integration tests with race detector
    cmds:
      - task: test
      - task: test:integration:race
      - task: test:e2e

  test:integration:
    desc: Run in-process integration tests (no Docker required)
    cmds:
      - go test -tags integration -timeout 120s -v ./integration/...

  test:integration:race:
    desc: Run integration tests with race detector
    cmds:
      - go test -tags integration -race -timeout 180s -v ./integration/...

  test:e2e:
    desc: Build stack, run E2E assertions, tear down (requires Docker)
    dir: docker
    cmds:
      - bash e2e_test.sh

  tailwind:
    desc: Build Tailwind CSS for admin UI
    cmds:
      - tailwindcss -i internal/admin/static/input.css -o internal/admin/static/admin.css --minify

  templ:generate:
    desc: Generate Go code from Templ templates
    cmds:
      - templ generate ./internal/admin/templates/
